[project]
name = "telegram-ai-agent-starter"
version = "0.1.0"
description = "Build a Telegram AI assistant that can call LLMs and tools."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
pydantic = ["pydantic-ai-slim[openai]>=1,<2"]

[tool.uv]
package = false
